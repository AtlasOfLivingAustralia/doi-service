{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-{{ include "ala-doi.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-3-2021-06
    alb.ingress.kubernetes.io/tags: >
      {{- range $key, $value := .Values.tags }}
      {{ $key }}={{ $value }},
      {{- end }}
    alb.ingress.kubernetes.io/load-balancer-attributes: >
      idle_timeout.timeout_seconds=90,
      access_logs.s3.enabled=true,
      access_logs.s3.bucket={{ .Values.ingress.accessLogsBucket }},
      access_logs.s3.prefix={{ .Values.ingress.accessLogsPrefix }}
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.hostname }}
    {{- if eq .Values.environment "testing" }}
    alb.ingress.kubernetes.io/listener-attributes.HTTP-80: >
      routing.http.response.access_control_allow_origin.header_value={{ .Values.ingress.cors.allowOrigin }},
      routing.http.response.access_control_allow_methods.header_value={{ .Values.ingress.cors.allowMethods }},
      routing.http.response.access_control_allow_headers.header_value={{ .Values.ingress.cors.allowHeaders }},
      routing.http.response.access_control_expose_headers.header_value={{ .Values.ingress.cors.exposeHeaders }},
      routing.http.response.access_control_max_age.header_value={{ .Values.ingress.cors.maxAge }},
      routing.http.response.access_control_allow_credentials.header_value={{ .Values.ingress.cors.allowCredentials }}
    alb.ingress.kubernetes.io/listener-attributes.HTTPS-443: >
      routing.http.response.access_control_allow_origin.header_value={{ .Values.ingress.cors.allowOrigin }},
      routing.http.response.access_control_allow_methods.header_value={{ .Values.ingress.cors.allowMethods }},
      routing.http.response.access_control_allow_headers.header_value={{ .Values.ingress.cors.allowHeaders }},
      routing.http.response.access_control_expose_headers.header_value={{ .Values.ingress.cors.exposeHeaders }},
      routing.http.response.access_control_max_age.header_value={{ .Values.ingress.cors.maxAge }},
      routing.http.response.access_control_allow_credentials.header_value={{ .Values.ingress.cors.allowCredentials }}
    alb.ingress.kubernetes.io/actions.cors-options: >
      {"Type":"fixed-response",
       "FixedResponseConfig":{
         "StatusCode":"200",
         "ContentType":"text/plain",
         "MessageBody":"OK",
         "Headers":[
           {"Key":"Access-Control-Allow-Origin","Value":"http://localhost:3000"},
           {"Key":"Access-Control-Allow-Methods","Value":"GET,POST,PUT,DELETE,OPTIONS"},
           {"Key":"Access-Control-Allow-Headers","Value":"Authorization,Content-Type,X-Requested-With"},
           {"Key":"Access-Control-Allow-Credentials","Value":"true"},
           {"Key":"Access-Control-Expose-Headers","Value":"X-Total-Count"},
           {"Key":"Access-Control-Max-Age","Value":"1728000"}
         ]
       }}
    {{- end }}
    {{- include "ala-doi.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host:  {{ .Values.ingress.hostname }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: svc-{{ include "ala-doi.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    {{- if eq .Values.environment "testing" }}
    - host: doi-test.ala.org.au
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: svc-{{ include "ala-doi.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- end }}
{{- end }}