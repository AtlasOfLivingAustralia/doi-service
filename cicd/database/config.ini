[DEFAULT]
PRODUCT_COMPONENT=database
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${ENVIRONMENT}
DATABASE_STACK_FILE_PFIX = database
DATABASE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-${ENVIRONMENT}
AUTO_DEPLOY = false
SLACK_DEPLOY_NOTIFICATION = true
SLACK_ALERT_CHANNEL = testing-deployments

# RDS
ADMIN_USER = dbmaster
BACKTRACK_WINDOW = 3600 # only applicable for MySQL
BACKUP_RETENTION = 1
CREATE_REPLICA = false
DB_INSTANCE_NAME = ${PRODUCT_NAME}-${ENVIRONMENT}
DELETION_PROTECTION = false
DB_ENGINE = aurora-postgresql # "aurora-mysql" or "aurora-postgresql"
ENGINE_MODE = serverlessv2 # provisioned or serverlessv2
# supported versions for serverlessv2:
# https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.Aurora_Fea_Regions_DB-eng.Feature.ServerlessV2.html
DB_VERSION = 16.9 # 8.0.mysql_aurora.3.09 for MySQL
DB_PARAM_GRP_FAMILY = aurora-postgresql16 # aurora-mysql8.0 for MySQL
INSTANCE_CLASS = db.t4g.medium # only used when ENGINE_MODE is provisioned
DATABASE_INSIGHTS_MODE = standard # "standard" or "enhanced"
# Performance insights is deprecated
# https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.Aurora_Fea_Regions_DB-eng.Feature.PerfInsights.html
PERFORMANCE_INSIGHTS = false # true or false
ENHANCED_MONITORING = 0 # enhanced monitoring interval in seconds. Set to 0 to disable.
# The snapshot ARN to restore the database from. Set to "false" to not use a snapshot.
RDS_SNAPSHOT_RESTORE = false
EXPORT_LOGS = false

[development]
# CodePipeline
PIPELINE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-pipeline-${CLEAN_BRANCH}
DATABASE_STACK_NAME = ala-${PRODUCT_NAME}-${PRODUCT_COMPONENT}-${CLEAN_BRANCH}
AUTO_DEPLOY = true

# RDS
DB_INSTANCE_NAME = ${PRODUCT_NAME}-${CLEAN_BRANCH}
# uncomment the following line to restore from a snapshot
#RDS_SNAPSHOT_RESTORE = arn:aws:rds:ap-southeast-2:748909248546:cluster-snapshot:ala-images-database-feature-rds-pipeline-updates-snapshot-dbcluster-wpangbshgwib
DATABASE_INSIGHTS_MODE = advanced # "standard" or "enhanced"
PERFORMANCE_INSIGHTS = true # true or false
ENHANCED_MONITORING = 5 # enhanced monitoring interval in seconds. Set to 0 to disable.

[testing]
AUTO_DEPLOY = true
# RDS
DATABASE_INSIGHTS_MODE = advanced # "standard" or "enhanced"
PERFORMANCE_INSIGHTS = true # true or false
ENHANCED_MONITORING = 5 # enhanced monitoring interval in seconds. Set to 0 to disable.

[staging]
PERFORMANCE_INSIGHTS = true

[production]
BACKTRACK_WINDOW = 259200 # 3 days (259200 seconds) only applicable for MySQL
DATABASE_INSIGHTS_MODE = advanced # "standard" or "enhanced"
DELETION_PROTECTION = true
PERFORMANCE_INSIGHTS = true
ENHANCED_MONITORING = 60
BACKUP_RETENTION = 30
CREATE_REPLICA = false
SLACK_ALERT_CHANNEL = deployments
ENGINE_MODE = provisioned
